[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nekotagger"
version = "0.1.0"
description = "把可执行文件归到 NekoTrak 的那套类别里"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
nekotagger = "nekotagger.__main__:main"

[tool.setuptools]
packages = ["nekotagger"]
